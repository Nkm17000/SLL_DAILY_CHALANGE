name: SLL Daily Quiz Challenge

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate four images without publishing
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 0 * * *" # 06:00 IST daily

permissions:
  contents: write
concurrency:
  group: sll-daily-quiz
  cancel-in-progress: false

jobs:
  challenge:
    if: "${{ github.event_name != 'push' || github.event.head_commit.message != 'chore: update quiz state' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate four medium-or-harder quiz challenges and publish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          TIMEZONE: Asia/Kolkata
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID_2: ${{ secrets.FACEBOOK_PAGE_ID_2 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_2: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_2 }}
          FACEBOOK_PAGE_ID_3: ${{ secrets.FACEBOOK_PAGE_ID_3 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_3: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_3 }}
          FACEBOOK_PAGE_ID_4: ${{ secrets.FACEBOOK_PAGE_ID_4 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_4: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_4 }}
          FACEBOOK_PAGE_ID_5: ${{ secrets.FACEBOOK_PAGE_ID_5 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_5: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_5 }}
          FACEBOOK_PAGE_ID_6: ${{ secrets.FACEBOOK_PAGE_ID_6 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_6: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_6 }}
          FACEBOOK_PAGE_ID_7: ${{ secrets.FACEBOOK_PAGE_ID_7 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_7: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_7 }}
          FACEBOOK_PAGE_ID_8: ${{ secrets.FACEBOOK_PAGE_ID_8 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_8: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_8 }}
          FACEBOOK_PAGE_ID_9: ${{ secrets.FACEBOOK_PAGE_ID_9 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_9: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_9 }}
          FACEBOOK_PAGE_ID_10: ${{ secrets.FACEBOOK_PAGE_ID_10 }}
          FACEBOOK_PAGE_ACCESS_TOKEN_10: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN_10 }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID_2: ${{ secrets.INSTAGRAM_USER_ID_2 }}
          INSTAGRAM_ACCESS_TOKEN_2: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_2 }}
          INSTAGRAM_USER_ID_3: ${{ secrets.INSTAGRAM_USER_ID_3 }}
          INSTAGRAM_ACCESS_TOKEN_3: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_3 }}
          INSTAGRAM_USER_ID_4: ${{ secrets.INSTAGRAM_USER_ID_4 }}
          INSTAGRAM_ACCESS_TOKEN_4: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_4 }}
          INSTAGRAM_USER_ID_5: ${{ secrets.INSTAGRAM_USER_ID_5 }}
          INSTAGRAM_ACCESS_TOKEN_5: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_5 }}
          INSTAGRAM_USER_ID_6: ${{ secrets.INSTAGRAM_USER_ID_6 }}
          INSTAGRAM_ACCESS_TOKEN_6: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_6 }}
          INSTAGRAM_USER_ID_7: ${{ secrets.INSTAGRAM_USER_ID_7 }}
          INSTAGRAM_ACCESS_TOKEN_7: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_7 }}
          INSTAGRAM_USER_ID_8: ${{ secrets.INSTAGRAM_USER_ID_8 }}
          INSTAGRAM_ACCESS_TOKEN_8: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_8 }}
          INSTAGRAM_USER_ID_9: ${{ secrets.INSTAGRAM_USER_ID_9 }}
          INSTAGRAM_ACCESS_TOKEN_9: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_9 }}
          INSTAGRAM_USER_ID_10: ${{ secrets.INSTAGRAM_USER_ID_10 }}
          INSTAGRAM_ACCESS_TOKEN_10: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_10 }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python quiz_challenge.py --dry-run
          else
            python quiz_challenge.py
          fi
      - name: Commit quiz history
        if: always()
        run: |
          if [ -f quiz_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add quiz_state.json
            git diff --cached --quiet || (git commit -m 'chore: update quiz state' && git push)
          fi
