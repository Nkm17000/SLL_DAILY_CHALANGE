name: Smart Learning Lab Daily Challenge

on:
  # IMPORTANT: Do not publish on git push.
  # This keeps normal commits and empty commits from triggering a post.
  workflow_dispatch:

  # Twice every day in Asia/Kolkata:
  # 09:00 IST = 03:30 UTC
  # 19:00 IST = 13:30 UTC
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 13 * * *'

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-daily-challenge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish next challenge to Facebook and Instagram
        env:
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIMEZONE: Asia/Kolkata
        run: python publish_daily.py

      - name: Save challenge state safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Refresh the remote branch before creating the state commit.
          git fetch origin main
          git rebase origin/main

          git add state.json
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
            exit 0
          fi

          git commit -m 'chore: update daily challenge state'

          # A human may push while this job is running. Rebase onto the newest
          # main and retry instead of failing with a non-fast-forward error.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'State pushed successfully.'
              exit 0
            fi

            echo "Push attempt ${attempt} failed; refreshing origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo 'Could not push state after 3 attempts.'
          exit 1
