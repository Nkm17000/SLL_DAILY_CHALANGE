name: Smart Learning Lab Daily Challenge

on:
  # Publish whenever a user pushes to main.
  # Commits made by this workflow with GITHUB_TOKEN do not recursively trigger
  # another workflow run.
  push:
    branches:
      - main

  # Manual on-demand publishing.
  workflow_dispatch:

  # Twice every day in Asia/Kolkata:
  # 09:00 IST = 03:30 UTC
  # 19:00 IST = 13:30 UTC
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 13 * * *'

permissions:
  contents: write

concurrency:
  group: smart-learning-lab-daily-challenge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish next challenge to Facebook and Instagram
        env:
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIMEZONE: Asia/Kolkata
        run: python publish_daily.py

      - name: Commit and push challenge state safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # publish_daily.py updates state.json. Keep that generated state in a
          # temporary location while we refresh the local branch from GitHub.
          if [ ! -f state.json ]; then
            echo 'state.json was not created; nothing to commit.'
            exit 0
          fi

          cp state.json /tmp/sll_daily_challenge_state.json

          # Rebuild the working tree from the latest remote main. This avoids
          # non-fast-forward failures when someone pushed while the workflow ran.
          git fetch --prune origin main
          git reset --hard origin/main
          cp /tmp/sll_daily_challenge_state.json state.json

          git add state.json
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
            exit 0
          fi

          git commit -m 'chore: update daily challenge state'

          # Retry in case another push lands between fetch/reset and push.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "State pushed successfully on attempt ${attempt}."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; refreshing origin/main..."
            cp state.json /tmp/sll_daily_challenge_state.json
            git fetch --prune origin main
            git reset --hard origin/main
            cp /tmp/sll_daily_challenge_state.json state.json
            git add state.json

            if git diff --cached --quiet; then
              echo 'Remote already contains the latest state.'
              exit 0
            fi

            git commit -m 'chore: update daily challenge state'
          done

          echo 'Could not push state after 5 attempts.'
          exit 1
